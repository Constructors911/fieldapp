<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C911 Field — Crew Onboarding</title>
  <style>
    :root {
      --navy: #0f2740;
      --navy-mid: #173552;
      --orange: #e8792b;
      --bg: #0c1d30;
      --card: #ffffff;
      --text: #1a2430;
      --muted: #6b7684;
      --green: #2e9e5b;
      --red: #d64545;
      --line: #e2e6ea;
      --soft: #f4f6f8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 20px 72px; }
    .slide {
      display: none; width: min(1180px, 100%); min-height: min(640px, 78vh);
      background: var(--card); color: var(--text); border-radius: 16px;
      padding: 32px 40px; overflow: auto;
    }
    .slide.active { display: flex; flex-direction: column; gap: 16px; }
    .slide.slide-tight { overflow: hidden; }
    .slide.slide-tight .split { align-items: center; flex: 1; min-height: 0; }
    .slide.slide-tight .copy { display: grid; gap: 10px; align-content: start; }
    .slide.slide-tight .copy p, .slide.slide-tight .copy li { font-size: 16px; }
    .slide.slide-tight ol { gap: 6px; }
    .slide.title-slide { background: var(--navy); color: #fff; justify-content: flex-end; }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); }
    .title-slide .kicker { color: #f3b27a; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.15; letter-spacing: -0.02em; }
    h2 { margin: 0; font-size: clamp(24px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.02em; }
    p, li { font-size: 18px; line-height: 1.45; color: var(--muted); }
    .title-slide p { color: rgba(255,255,255,0.78); max-width: 28em; }
    .title-slide h1 { max-width: 14ch; }
    ul, ol { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
    li strong, p strong { color: var(--text); font-weight: 650; }
    .title-slide li, .title-slide strong { color: #fff; }
    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
    .card h3 { margin: 0 0 6px; font-size: 16px; color: var(--navy); }
    .card p, .card li { font-size: 15px; margin: 0; }
    .step { display: flex; gap: 12px; align-items: flex-start; }
    .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff;
      display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 2px; }
    .callout { border-left: 4px solid var(--orange); background: #fff6ee; padding: 12px 16px; border-radius: 0 10px 10px 0; }
    .callout p { margin: 0; color: var(--text); font-size: 16px; }
    .ok { border-left-color: var(--green); background: #eef8f1; }
    .warn { border-left-color: var(--red); background: #fdeeee; }
    table { width: 100%; border-collapse: collapse; font-size: 16px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    td:first-child { font-weight: 650; color: var(--navy); width: 28%; }
    .checks { display: grid; gap: 10px; }
    .checks label { display: flex; gap: 10px; align-items: flex-start; font-size: 17px; color: var(--text); }
    .checks input { margin-top: 4px; width: 18px; height: 18px; }
    .footer {
      position: fixed; left: 0; right: 0; bottom: 0; height: 64px;
      background: #0a1828; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    }
    .footer button {
      min-height: 40px; min-width: 44px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--navy-mid); color: #fff; font-weight: 650; padding: 0 14px;
    }
    .footer button.primary { background: var(--orange); }
    .footer button:disabled { opacity: 0.35; cursor: default; }
    .progress { flex: 1; height: 4px; background: #1d3550; border-radius: 99px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--orange); width: 0; }
    .count { font-size: 13px; color: rgba(255,255,255,0.65); min-width: 4.5em; text-align: right; }
    .notes {
      display: none; position: fixed; right: 16px; bottom: 80px; width: min(360px, 92vw);
      background: #10263d; color: #d7e0ea; border: 1px solid #2a4663; border-radius: 12px; padding: 14px 16px;
      font-size: 14px; line-height: 1.45; max-height: 40vh; overflow: auto;
    }
    .notes.show { display: block; }
    .notes b { color: #fff; }
    .hint { font-size: 12px; color: rgba(255,255,255,0.45); margin-right: 8px; }
    .url { font-family: ui-monospace, Consolas, monospace; font-size: 16px; color: var(--navy); word-break: break-all; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: start; }
    .phones { display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .phone {
      margin: 0; width: 228px; background: #0a1828; border-radius: 26px;
      padding: 10px 8px 12px; flex: none;
    }
    .phone img { width: 100%; display: block; border-radius: 16px; background: var(--soft); }
    .phone figcaption {
      margin: 8px 2px 0; color: #fff; font-size: 12px; font-weight: 650; text-align: center;
    }
    .shot-web {
      margin: 0; width: min(300px, 100%); background: var(--soft); border: 1px solid var(--line);
      border-radius: 12px; padding: 8px; flex: none;
    }
    .title-slide .shot-web { background: #071320; border-color: #1d3550; }
    .shot-web img {
      width: 100%; display: block; border-radius: 6px; background: #fff;
      max-height: min(420px, 56vh); object-fit: contain;
    }
    .shot-web figcaption {
      margin: 8px 2px 0; color: var(--muted); font-size: 12px; font-weight: 650; text-align: center;
    }
    .title-slide .shot-web figcaption { color: rgba(255,255,255,0.75); }
    .title-slide .phone { background: #071320; }
    .title-slide .phone figcaption { color: rgba(255,255,255,0.75); }
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; }
      .phones { justify-content: center; }
    }
    @media (max-width: 800px) {
      .slide { padding: 24px 20px; min-height: 0; }
      .grid.two, .grid.four { grid-template-columns: 1fr; }
      p, li { font-size: 16px; }
      .phone { width: min(220px, 72vw); }
    }
    @media print {
      body { background: #fff; height: auto; display: block; }
      .footer, .notes { display: none !important; }
      .stage { padding: 0; display: block; }
      .slide { display: flex !important; break-after: page; min-height: 0; box-shadow: none; border: 1px solid #ddd; margin: 0 0 16px; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <aside class="notes" id="notes"></aside>
  <nav class="footer">
    <button type="button" id="prev" aria-label="Previous slide">Back</button>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    <span class="count" id="count"></span>
    <span class="hint">Arrows · N notes · F fullscreen</span>
    <button type="button" id="notesBtn">Notes</button>
    <button type="button" class="primary" id="next">Next</button>
  </nav>

        <div class="card"><h3>During the day</h3>
          <ol>
            <li>Check off tasks as they finish</li>
            <li>Take Before / During / After photos</li>
            <li>Clock out / in when you change jobs</li>
          </ol>
        </div>
        <div class="card"><h3>Leaving a job</h3>
          <ol>
            <li>Clock Out → Done for the day</li>
            <li>Finish the log if prompted</li>
            <li>Confirm the punch shows under Today’s entries</li>
          </ol>
        </div>
        <div class="card"><h3>If you bounce sites</h3>
          <p>One job per punch. Out on A, in on B. Each job you finish for the day needs its own log.</p>
        </div>
      </div>`,
    shots: [
      { src: "onboarding-shots/10-today.png", caption: "Morning — Today" },
      { src: "onboarding-shots/07-clocked-in.png", caption: "On the job — Clock" },
      { src: "onboarding-shots/09-clock-out-log.png", caption: "Leaving — log + out" }
    ],
    notes: "This is the slide to leave on the wall during the live drill."
  },
  {
    kicker: "When it breaks",
    title: "Fix it in this order",
    body: `
      <table>
        <thead><tr><th>What you see</th><th>What to do</th></tr></thead>
        <tbody>
          <tr><td>Job missing from the list</td><td>Tap Clock In again (it refreshes jobs). If still missing, the job may not be Approved yet — text the office.</td></tr>

          <tr><td>Forgot PIN</td><td>Supervisor taps Reset PIN in Admin. Crew uses Create your sign-in with the same email and a new PIN. Do not use a different email.</td></tr>
          <tr><td>Cannot sign into JobTread</td><td>Use Create or Reset on app.jobtread.com with your work email. Office adds you to the JT org if you have no account.</td></tr>
          <tr><td>Wrong email / not in JobTread</td><td>Office must add you to the org first.</td></tr>
          <tr><td>Grant belongs to a different user</td><td>Create a new grant while signed into JobTread as yourself — not a coworker’s key.</td></tr>
          <tr><td>Logs show under the office name</td><td>Log tab → paste your personal grant → Connect. Then write a new log.</td></tr>
        </tbody>
      </table>`,
    notes: "Escalation: supervisor → whoever owns JobTread users. Admin → Crew → Reset PIN lets them re-register the same email. Do not delete the employees row."
  },
  {
    kicker: "Day one",
    title: "Before you leave this meeting",
    body: `
      <div class="checks">

        <label><input type="checkbox" /> Location is allowed — or I know hours still save without it</label>
        <label><input type="checkbox" /> I checked off at least one Today item</label>
        <label><input type="checkbox" /> I submitted a daily log with a photo tag</label>
        <label><input type="checkbox" /> I clocked out Done for the day and see the entry on Clock</label>

    shots: [{ src: "onboarding-shots/03-clock-ready.png", caption: "Match this: signed in, on Clock" }],
    notes: "Do not dismiss until every person has Connected their grant, a visible punch, and a log. Watch for people who tapped Not now or only clocked a break."
  },
  {
    kind: "title",
    kicker: "You’re on it",
    title: "Questions, then we punch a real day",
    body: "<p>Clock before you start. Check work off as you go. Log before you leave. If the badge says pending, get signal before you assume the office has it.</p>",
    shots: [{ src: "onboarding-shots/07-clocked-in.png", caption: "Your day starts here" }],
    notes: "Open the floor. Then live: install → register → connect JT grant → clock in → check a task → clock out with a log. Collect no PINs or grant keys. Confirm JobTread emails for anyone who 404s."
  }
];

const stage = document.getElementById("stage");
const notesEl = document.getElementById("notes");
const bar = document.getElementById("bar");
const count = document.getElementById("count");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
let i = 0;

function phoneFigures(shots) {
  const compact = shots.length > 2 ? " style=\"width:196px\"" : "";
  return shots.map((sh) => {
    const kind = sh.kind === "web" ? "shot-web" : "phone";
    const extra = kind === "phone" ? compact : "";
    return `
    <figure class="${kind}"${extra}>
      <img src="${sh.src}" alt="${sh.caption}">
      <figcaption>${sh.caption}</figcaption>
    </figure>`;
  }).join("");
}

function render() {
  const s = SLIDES[i];
  const shots = s.shots || [];
  const inner = shots.length
    ? `<div class="split">
        <div class="copy">${s.body}</div>
        <div class="phones">${phoneFigures(shots)}</div>
      </div>`
    : s.body;
  const extraClass = [s.kind === "title" ? "title-slide" : "", s.tight ? "slide-tight" : ""].filter(Boolean).join(" ");
  stage.innerHTML = `<section class="slide active ${extraClass}" aria-live="polite">
    <div class="kicker">${s.kicker}</div>
    <h${s.kind === "title" ? "1" : "2"}>${s.title}</h${s.kind === "title" ? "1" : "2"}>
    ${inner}
  </section>`;
  notesEl.innerHTML = `<b>Trainer notes</b><br>${s.notes}`;
  bar.style.width = `${((i + 1) / SLIDES.length) * 100}%`;
  count.textContent = `${i + 1} / ${SLIDES.length}`;
  prev.disabled = i === 0;
  next.disabled = i === SLIDES.length - 1;
  next.textContent = i === SLIDES.length - 1 ? "Done" : "Next";
}

prev.onclick = () => { if (i > 0) { i -= 1; render(); } };
next.onclick = () => { if (i < SLIDES.length - 1) { i += 1; render(); } };
document.getElementById("notesBtn").onclick = () => notesEl.classList.toggle("show");

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next.click(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev.click(); }
  if (e.key === "n" || e.key === "N") notesEl.classList.toggle("show");
  if (e.key === "f" || e.key === "F") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  if (e.key === "Home") { i = 0; render(); }
  if (e.key === "End") { i = SLIDES.length - 1; render(); }
});

let startX = null;
stage.addEventListener("touchstart", (e) => { startX = e.changedTouches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (startX == null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (dx < -40) next.click();
  if (dx > 40) prev.click();
  startX = null;
}, { passive: true });

render();
</script>
</body>
